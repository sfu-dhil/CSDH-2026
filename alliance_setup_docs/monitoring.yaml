# see: https://medium.com/@inderjotsingh141/set-up-monitoring-and-logging-in-a-docker-swarm-cluster-7fce37b78cf7
# see: https://medium.com/@dineshmurali/introduction-to-monitoring-with-prometheus-grafana-ea338d93b2d9
services:
  grafana:
    image: grafana/grafana:11.3.1
    volumes:
      # persistence
      - /mnt/docker-swarm-persistence/grafana-data:/var/lib/grafana
    networks:
      - traefik-public
      - monitoring-private
    environment:
      - GF_SERVER_ROOT_URL=https://alliance-analytics.dhil.lib.sfu.ca
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      # These are one time only
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      # EXAMPLE: - GF_SECURITY_ADMIN_EMAIL=dhil@sfu.ca
      - GF_SECURITY_ADMIN_EMAIL=<YOUR ADMIN_EMAIL>
    secrets:
      - grafana_admin_password
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        delay: 10s
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.constraint-label=traefik-public
        # EXAMPLE: - traefik.http.routers.grafana.rule=Host(`alliance-analytics.dhil.lib.sfu.ca`)
        - traefik.http.routers.grafana.rule=Host(`<YOUR GRAFANA_DOMAIN>`)
        - traefik.http.routers.grafana.entrypoints=https_443
        - traefik.http.routers.grafana.service=grafana
        - traefik.http.services.grafana.loadbalancer.server.port=3000
  prometheus:
    image: prom/prometheus:v3.0.0
    command:
      - --config.file=/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      # persistence
      - /mnt/docker-swarm-persistence/prometheus-data:/prometheus
    configs:
      - source: prometheus_yaml
        target: /prometheus.yaml
    networks:
      - monitoring-private
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        delay: 10s
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=false
  node_exporter:
    image: prom/node-exporter:v1.8.2
    user: root:root
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc|host/var/lib/docker/containers|host/var/lib/docker/overlay2|host/run/docker/netns|host/var/lib/docker/aufs)($$|/)
    volumes:
      # readonly on filesystem
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      - monitoring-private
    deploy:
      mode: global
      update_config:
        order: start-first
        delay: 10s
      labels:
        - traefik.enable=false
  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    volumes:
      # readonly on filesystem
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring-private
    deploy:
      mode: global
      update_config:
        order: start-first
        delay: 10s
      labels:
        - traefik.enable=false
configs:
  prometheus_yaml:
    file: ./config/prometheus.yaml
secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
networks:
  monitoring-private:
    external: true
  traefik-public:
    external: true