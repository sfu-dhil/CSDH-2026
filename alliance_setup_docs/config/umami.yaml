http:
  middlewares:
    umami-tracking-middleware:
      plugin:
        umami-feeder:
          # debug: true
          umamiHost: http://umami_tracking:3000
          umamiUsername: admin
          umamiPassword: <GET FROM '../secrets/umami_db_password'>
          # trackAllResources: true
          # queueSize: 100
          createNewWebsites: true
          ignoreURLs:
            # health checks
            - /health$
            # admin pages
            - ^/admin/
            - ^/manage/
          ignoreHosts:
            # redirects
            # special
          # based on well know bots from https://github.com/arcjet/well-known-bots/blob/main/well-known-bots.json
          ignoreUserAgents:
            - "Googlebot"
            - "Googlebot-Mobile"
            - "Googlebot-Image"
